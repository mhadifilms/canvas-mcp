[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-mcp"
version = "0.1.0"
description = "MCP server for Canvas LMS that works without an API key, by reusing the browser session you already have"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "M Hadi" }]
keywords = ["mcp", "canvas", "lms", "instructure", "students", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/mhadifilms/canvas-mcp"
Issues = "https://github.com/mhadifilms/canvas-mcp/issues"

[project.optional-dependencies]
# Pull the Canvas session straight out of an already-logged-in browser.
browsers = ["browser-cookie3>=0.19.1"]
# Pop open a real browser window so you can log in through your school's SSO.
login = ["playwright>=1.40"]
# Read the text out of slides, readings and handouts.
documents = ["pypdf>=4.0", "python-docx>=1.1", "python-pptx>=0.6.23"]
all = [
    "browser-cookie3>=0.19.1",
    "playwright>=1.40",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "icalendar>=5"]

[project.scripts]
canvas-mcp = "canvas_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
